<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#262c14" />
  <title>សិរីសួស្តីអាពាហ៍ពិពាហ៍ · ទេព សុធា & ចាយ វិច្ឆិកា</title>
  <meta name="description" content="សូមគោរពអញ្ជើញចូលរួមពិធីអាពាហ៍ពិពាហ៍ ទេព សុធា & ចាយ វិច្ឆិកា · Tep Sothea & Chay Vicheka Wedding Invitation" />

  <!-- OpenGraph Metadata -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="សិរីសួស្តីអាពាហ៍ពិពាហ៍ · សុធា & វិច្ឆិកា" />
  <meta property="og:description" content="សូមគោរពអញ្ជើញ · You are warmly invited to the wedding of Tep Sothea & Chay Vicheka" />
  <meta property="og:image" content="https://theapka-wedding.vercel.app/images/couple.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="is-locked" data-lang="km">

  <!-- Global SVG Defs (Metallic Foil Gradients & Scallop ClipPaths) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-foil" x1="0" y1="0" x2="1" y2="0.35" gradientUnits="objectBoundingBox">
        <stop offset="0%" stop-color="#9c7124" />
        <stop offset="25%" stop-color="#d9b15a" />
        <stop offset="45%" stop-color="#fbefc0" />
        <stop offset="62%" stop-color="#d9b15a" />
        <stop offset="85%" stop-color="#9c7124" />
        <stop offset="100%" stop-color="#d9b15a" />
      </linearGradient>
    </defs>
  </svg>

  <div class="grain" aria-hidden="true"></div>

  <!-- 1. ENVELOPE GATE SCREEN -->
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-label="Wedding Invitation Envelope">
    <div class="gate__bg" aria-hidden="true">
      <img src="/images/couple.jpg" alt="" />
    </div>

    <div class="gate__stage">
      <div class="gate__invite">
        <div class="gate__kicker foil" id="gate-kicker">សិរីសួស្តីអាពាហ៍ពិពាហ៍</div>
        <div class="gate__sub" id="gate-sub">The Wedding Invitation</div>
      </div>

      <div id="env-mount"></div>

      <div class="gate__hint" id="gate-hint">សូមចុចលើត្រា ដើម្បីបើកធៀបការ</div>
    </div>

    <div class="gate__dim" id="gate-dim" aria-hidden="true"></div>
  </div>

  <!-- 2. HUD HEADER -->
  <header class="hud" id="hud">
    <div class="hud__mono" id="hud-mono"></div>
    <div class="hud__right">
      <button class="chip" id="lang-toggle" type="button" aria-label="Switch language">
        <span class="lang-text">ខ្មែរ / EN</span>
      </button>
      <button class="chip" id="music-toggle" type="button" aria-pressed="false" aria-label="Toggle background music">
        <span class="bars" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </span>
      </button>
    </div>
  </header>

  <!-- 3. MAIN SECTION CONTAINER -->
  <main id="main">
    <div id="cover-mount"></div>
    <div id="words-mount"></div>
    <div id="couple-mount"></div>
    <div id="countdown-mount"></div>
    <div id="programme-mount"></div>
    <div id="story-mount"></div>
    <div id="candlelight-mount"></div>
    <div id="gallery-mount"></div>
    <div id="venue-mount"></div>
    <div id="gift-mount"></div>
    <div id="wishes-mount"></div>
  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
